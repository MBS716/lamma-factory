name: net-check
# A diagnostic only: which outside host does a page of the site wait for on GitHub's machines (reads, writes nothing).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  net:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null
      - name: hosts
        run: |
          for u in https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js https://fonts.googleapis.com/css2?family=Tajawal https://cdnjs.cloudflare.com/ https://picsum.photos/ https://mbs716.github.io/lamma-factory/preview-akml/ https://mbs716.github.io/lamma/; do
            echo "$u -> $(curl -s -o /dev/null -m 20 -w '%{http_code} %{time_total}s' "$u" || echo fail)"; done
      - name: what the page waits for
        run: |
          cat > w.py <<'P'
          import asyncio, time
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch(); pg = await b.new_page(); pend = {}
                  pg.on('request', lambda r: pend.__setitem__(r.url, time.time()))
                  pg.on('requestfinished', lambda r: pend.pop(r.url, None)); pg.on('requestfailed', lambda r: print('FAILED', r.url[:120], r.failure))
                  try: await pg.goto('https://mbs716.github.io/lamma-factory/preview-akml/', wait_until='load', timeout=40000); print('load OK')
                  except Exception as e: print('load timeout')
                  for u, t in pend.items(): print('PENDING', u[:150])
                  await b.close()
          asyncio.run(main())
          P
          python w.py
