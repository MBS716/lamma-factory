# Checks that the preview of the next Lamma site (served from preview/ by GitHub Pages) is online.
name: preview-check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["preview/**", ".github/workflows/preview.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 90
          for u in index.html spot/s01a.webp spot/s20b.webp; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://mbs716.github.io/lamma-factory/preview/$u"); echo "$u $code"; [ "$code" = 200 ] || exit 1
          done
          curl -s https://mbs716.github.io/lamma-factory/preview/ | grep -c "SPOT_LIB"
