# Preview of the next Lamma site (separate from the live site): publishes preview/ to GitHub Pages of this repo.
name: preview
on:
  push:
    branches: [main]
    paths: ["preview/**", ".github/workflows/preview.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with: {enablement: true}
      - uses: actions/upload-pages-artifact@v3
        with: {path: preview}
      - id: d
        uses: actions/deploy-pages@v4
