# Read what the Lamma Realtime Database rules allow, the way any visitor's browser could (no login, no keys).
# Only status codes and counts are recorded, never the stored data. The probe writes only to its own
# throw-away paths (probe-lamma/<random> and rooms/lm2-probe<random>) and deletes them at the end.
name: rules-probe
on:
  push:
    branches: [main]
    paths: [".github/workflows/rules-probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          DB=https://lamma-b3804-default-rtdb.europe-west1.firebasedatabase.app
          R=$(python3 -c "import secrets;print(secrets.token_hex(5))"); O=reports/rules-probe; mkdir -p $O
          st(){ curl -s -o /tmp/body -w "%{http_code}" -X "$1" "$DB/$2" ${3:+-d "$3"}; }
          cnt(){ python3 -c "import json;d=json.load(open('/tmp/body'));print(len(d) if isinstance(d,dict) else ('null' if d is None else 'value'))" 2>/dev/null || echo "-"; }
          {
          echo "time (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "No sign-in at all (a script or a browser without the site). Expected after the new rules: 401 for every line."
          echo "read whole database: $(st GET '.json?shallow=true')"
          echo "read rooms list: $(st GET 'rooms.json?shallow=true')"
          echo "read one room by its code: $(st GET 'rooms/lm3-1234.json')"
          echo "read host locks: $(st GET 'hosts.json?shallow=true')"
          echo "read one host lock: $(st GET 'hosts/lm3-1234.json')"
          echo "read saved matches: $(st GET 'games.json?shallow=true')"
          echo "read hidden answers: $(st GET 'gpriv.json?shallow=true')"
          echo "read spot history list: $(st GET 'spotseen.json?shallow=true')"
          echo "read spot reports: $(st GET 'spotreports.json?shallow=true')"
          echo "write a new top-level path: $(st PUT "probe-lamma/$R.json" '{"t":1}')"
          echo "write a seat in a room: $(st PUT "rooms/lm3-0001/probe$R.json" '{"j":"{}","t":1,"u":"x","c":1}')"
          echo "write a fake host seat: $(st PUT "rooms/lm3-0001/probeh$R.json" '{"j":"{\"r\":\"h\"}","t":1,"u":"x","c":1,"h":true}')"
          echo "take a host lock: $(st PUT "hosts/lm3-0001.json" '{"u":"x","g":"quiz","t":1}')"
          echo "change a saved match (scores): $(st PUT "games/lm3-0001.json" '{"g":"quiz","v":3,"s":"{}","at":1}')"
          echo "delete a room (test code 0001, never used by games): $(st DELETE "rooms/lm3-0001.json")"
          echo "write spot history: $(st PUT "spotseen/probedevice01/p1.json" '1')"
          echo "write a spot report: $(st PUT "spotreports/p1/probedevice01.json" '1')"
          } 2>&1 | tee $O/report.txt
      - name: save
        run: |
          git config user.name "lamma-factory"; git config user.email "factory@users.noreply.github.com"
          git add reports/rules-probe
          if git diff --cached | grep -Eq 'github_pat_|ghp_|gho_|x-access-token|AUTHORIZATION'; then exit 1; fi
          git commit -q -m "rules probe" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 10; done
