# The final database rules on the official Firebase emulators (Database + Auth). Nothing is sent to the real database.
#  1. tests/rules/rules.test.mjs: allowed and forbidden writes (score tampering, host/player impersonation, sessions)
#  2. the whole site (tests/emu-site = a TEST build that talks only to the emulators) played end to end with anonymous
#     sign-in, a computer host, an iPhone (WebKit) and an Android (Chromium) phone
name: rules-test
on:
  push:
    branches: [main]
    paths: ["firebase/**", "tests/rules/**", "tests/emu-site/**", "tests/live_e2e_v3.py", ".github/workflows/rules-test.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: npm i --no-save firebase-tools@13 @firebase/rules-unit-testing@3 firebase@10
      - run: pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium webkit > /dev/null
      - name: rules and the whole site on the emulators
        run: |
          echo '{"emulators":{"database":{"port":9000},"auth":{"port":9099},"ui":{"enabled":false}},"database":{"rules":"firebase/database.rules.json"}}' > firebase.json
          mkdir -p reports/rules-test; timeout 3300 npx firebase emulators:exec --only database,auth --project demo-lamma "bash tests/rules/run_all.sh" > reports/rules-test/emulators.log 2>&1 || true; tail -40 reports/rules-test/emulators.log
          test -f reports/rules-test/result.txt && ! grep -q '^FAIL' reports/rules-test/result.txt
          python -c "import json,sys; d=json.load(open('reports/rules-test/site-e2e/result.json')); sys.exit(0 if d['PASS'] else 1)"
      - name: save
        if: always()
        run: |
          rm -f firebase.json database-debug.log firebase-debug.log
          git config user.name "lamma-factory"; git config user.email "factory@users.noreply.github.com"
          git add reports/rules-test || true
          if git diff --cached | grep -Eq 'github_pat_|ghp_|gho_|x-access-token|AUTHORIZATION'; then exit 1; fi
          git commit -q -m "rules emulator test" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 10; done
