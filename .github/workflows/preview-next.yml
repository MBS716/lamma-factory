# Real test of the next Lamma version preview (served from preview-next/ by GitHub Pages of this repo).
# The preview is marked noindex and uses its own rooms (lmp3-), so SEO is checked on the official site only.
name: preview-next-test
on:
  push:
    branches: [main]
    paths: ["preview-next/**", "tests/live_e2e_v3.py", ".github/workflows/preview-next.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium webkit
      - name: wait until GitHub Pages serves this commit
        run: |
          want=$(md5sum preview-next/index.html | cut -c1-32)
          for i in $(seq 1 40); do
            got=$(curl -s "https://mbs716.github.io/lamma-factory/preview-next/index.html?nc=$RANDOM" | md5sum | cut -c1-32)
            [ "$got" = "$want" ] && echo "live after $((i*15))s" && exit 0; sleep 15
          done; echo "pages did not update"; exit 1
      - run: python tests/live_e2e_v3.py https://mbs716.github.io/lamma-factory/preview-next/ reports/site-test/preview-next https://mbs716.github.io/lamma/
      - if: always()
        run: |
          git config user.name "lamma-factory"; git config user.email "factory@users.noreply.github.com"
          git pull -q --rebase || true
          git add reports/site-test
          if git diff --cached | grep -Eq 'github_pat_|ghp_|gho_|x-access-token|AUTHORIZATION'; then echo "refusing to commit: credential-like text found"; exit 1; fi
          git commit -q -m "preview-next test results" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase && git push -q && exit 0; sleep 15; done; echo "could not save the results"; exit 1
