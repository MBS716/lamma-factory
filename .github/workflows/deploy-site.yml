# Publishes site/ (index.html + spot/) to MBS716/lamma.
#
# .github/deploy-request decides what happens:
#   dry-run      check the files and simulate the upload into a throw-away local copy (no token used)
#   branch       upload to branch update-spot of MBS716/lamma (the live site does not change)
#   branch:NAME  upload to branch NAME (lower-case letters, digits, dashes; never main)
#   main-approved  publish to main (the live site) - only after the owner's explicit approval
#   anything else  nothing is done
#
# Security rules for this file:
#   * the token is only ever passed as an HTTP header via git -c; it is never part of a URL, a file or a command echo
#   * no shell tracing (set -x), no printing of git output that could contain credentials
#   * the cloned lamma/ folder is deleted before anything is committed back to this repository
#   * every commit back to this repository is scanned for credential-looking text first
name: deploy-site
on:
  push:
    branches: [main]
    paths: [".github/deploy-request", "site/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: what to do
        id: mode
        run: |
          r=$(tr -d ' \r\n' < .github/deploy-request); m=${r%%:*}; b=update-spot
          case "$r" in branch:*) b=${r#branch:} ;; esac
          case "$m" in dry-run|branch|main-approved) ;; *) m=none ;; esac
          if [ "$m" = branch ] && ! echo "$b" | grep -Eq '^[a-z0-9][a-z0-9-]{0,39}$'; then m=none; fi
          if [ "$m" = branch ] && [ "$b" = main ]; then m=none; fi
          [ "$m" = main-approved ] && b=main
          echo "mode=$m" >> "$GITHUB_OUTPUT"; echo "branch=$b" >> "$GITHUB_OUTPUT"; echo "mode: $m, branch: $b"
      - name: check the site files
        run: |
          test -f site/index.html || { echo "site/index.html missing"; exit 1; }
          n=$(python3 - <<'PY'
          import json, os, sys
          need = ["site/index.html", "site/tiger.webp", "site/spot/catalog/index.json"]
          idx = json.load(open("site/spot/catalog/index.json"))
          for sh in idx["shards"]:
              need.append("site/spot/catalog/" + sh["name"])
              for e in json.load(open("site/spot/catalog/" + sh["name"])): need += [f"site/spot/pairs/{e['id']}a.webp", f"site/spot/pairs/{e['id']}b.webp"]
          for f in os.listdir("site/data"): need.append("site/data/" + f)
          miss = [f for f in need if not os.path.isfile(f)]
          if miss: print("missing:", miss[:20], file=sys.stderr); sys.exit(1)
          print(idx["total"], "pairs, levels", idx["levels"], "; banks:", {f: len(json.load(open("site/data/" + f))) for f in os.listdir("site/data")}, file=sys.stderr)
          print(len(need))
          PY
          )
          echo "files referenced and present: $n"
      - name: every spot pair loads and every difference is real (no unlisted changes)
        run: |
          pip install -q pillow numpy scipy
          python site-src/tools/verify_spot.py site
      - name: simulate the upload (no token)
        if: steps.mode.outputs.mode == 'dry-run'
        env: {B: "${{ steps.mode.outputs.branch }}"}
        run: |
          git init -q --bare /tmp/fake-lamma.git
          git clone -q /tmp/fake-lamma.git work && cd work
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          echo "old" > index.html; git add -A; git commit -qm old; git branch -M main; git push -q origin main
          git checkout -q -B "$B"
          rm -rf index.html spot data tiger.webp; cp -r ../site/. .
          git add -A; git commit -qm "update"; git push -q -f origin "$B"
          cd .. && git clone -q -b "$B" /tmp/fake-lamma.git check
          diff -r --exclude=.git site check && echo "dry run OK: $B would contain exactly site/"
          rm -rf work check
      - name: upload to MBS716/lamma
        if: steps.mode.outputs.mode == 'branch' || steps.mode.outputs.mode == 'main-approved'
        env: {T: "${{ secrets.LAMMA_DEPLOY_TOKEN }}", MODE: "${{ steps.mode.outputs.mode }}", B: "${{ steps.mode.outputs.branch }}"}
        run: |
          [ -n "$T" ] || { echo "secret LAMMA_DEPLOY_TOKEN is missing"; exit 1; }
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$T" | base64 -w0)"
          echo "::add-mask::$AUTH"
          g() { git -c "http.https://github.com/.extraheader=$AUTH" "$@" > /dev/null 2>&1; }
          g clone -q https://github.com/MBS716/lamma.git lamma || { echo "clone failed (token invalid or no access)"; exit 1; }
          cd lamma
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git ls-remote --exit-code origin backup-before-spot-update > /dev/null 2>&1 || true
          if [ "$MODE" = "main-approved" ]; then
            # keep the current live version: backup branch named after today's date (never overwritten)
            BK="backup-main-$(date -u +%Y%m%d-%H%M)"
            g push -q origin "refs/remotes/origin/main:refs/heads/$BK" || { echo "backup failed, not publishing"; exit 1; }
            git ls-remote --exit-code https://github.com/MBS716/lamma.git "refs/heads/$BK" > /dev/null || { echo "backup not found, not publishing"; exit 1; }
            echo "backup of the previous main: $BK ($(git rev-parse origin/main))" | tee ../backup.txt
            git checkout -q main
          else git checkout -q -B "$B"; fi
          rm -rf index.html spot data tiger.webp; cp -r ../site/. .
          git add -A; git commit -q -m "$(cat ../.github/deploy-message 2>/dev/null || echo 'Update the Lamma site')" || echo "nothing to commit"
          if [ "$MODE" = "main-approved" ]; then g push -q origin main; else g push -q -f origin "$B"; fi || { echo "push failed"; exit 1; }
          echo "uploaded to $B: $(find spot -type f | wc -l) spot files + index.html + data"
          cd .. && rm -rf lamma
          # read the branch back (public repo, no token) and compare it with site/
          b="$B"
          git clone -q --depth 1 -b "$b" https://github.com/MBS716/lamma.git readback
          mkdir -p reports/site-test
          { echo "branch: $b"; echo "commit: $(git -C readback rev-parse HEAD)"; echo "date (UTC): $(date -u '+%Y-%m-%d %H:%M')"; cat backup.txt 2>/dev/null || true; echo "index.html: $(md5sum readback/index.html | cut -c1-32) (expected $(md5sum site/index.html | cut -c1-32))";
            echo "spot files: $(find readback/spot -type f | wc -l) (expected $(find site/spot -type f | wc -l))"; diff -rq --exclude=.git site readback && echo "files identical to site/: yes" || echo "files identical to site/: NO"; } | tee reports/site-test/upload-$b.txt
          diff -rq --exclude=.git site readback > /dev/null
      - uses: actions/setup-python@v5
        if: steps.mode.outputs.mode == 'branch' || steps.mode.outputs.mode == 'main-approved'
        with: {python-version: "3.11"}
      - name: test the uploaded branch in a real browser (real Firebase, files served from the branch copy)
        if: steps.mode.outputs.mode == 'branch'
        run: |
          pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium webkit > /dev/null
          (cd readback && python -m http.server 8799 > /dev/null 2>&1 &) ; sleep 2
          python tests/live_e2e_v3.py http://localhost:8799/ reports/site-test/branch3-$(cat .github/deploy-request | tr -d ' \r\n' | sed 's/.*://')
          python tests/seo_check.py http://localhost:8799/ reports/site-test/branch-seo https://mbs716.github.io/lamma/
      - name: test the live site
        if: steps.mode.outputs.mode == 'main-approved'
        run: |
          pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium webkit > /dev/null
          want=$(md5sum site/index.html | cut -c1-32)
          for i in $(seq 1 60); do
            got=$(curl -s "https://mbs716.github.io/lamma/index.html?nc=$RANDOM" | md5sum | cut -c1-32)
            [ "$got" = "$want" ] && echo "live after $((i*15))s" && break; sleep 15
          done
          [ "$got" = "$want" ] && echo "live site serves the new index.html: yes" | tee -a reports/site-test/upload-main.txt || { echo "live site serves the new index.html: NO" | tee -a reports/site-test/upload-main.txt; exit 1; }
          python tests/live_e2e_v3.py https://mbs716.github.io/lamma/ reports/site-test/live
          python tests/seo_check.py https://mbs716.github.io/lamma/ reports/site-test/live-seo
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def m():
              async with async_playwright() as p:
                  b = await p.chromium.launch(); pg = await b.new_page(viewport={'width': 1280, 'height': 900})
                  await pg.goto("https://github.com/MBS716/lamma/tree/main", wait_until="load"); await pg.wait_for_timeout(3000)
                  await pg.screenshot(path="reports/site-test/live/github_main.png")
                  await pg.goto("https://github.com/MBS716/lamma/tree/main/spot", wait_until="load"); await pg.wait_for_timeout(3000)
                  await pg.screenshot(path="reports/site-test/live/github_main_spot.png", full_page=True)
                  await b.close()
          asyncio.run(m())
          PY
      - name: save test results (scanned for credentials first)
        if: always() && (steps.mode.outputs.mode == 'branch' || steps.mode.outputs.mode == 'main-approved')
        run: |
          rm -rf lamma readback
          git config user.name "lamma-factory"; git config user.email "factory@users.noreply.github.com"
          git add reports/site-test 2>/dev/null || exit 0
          if git diff --cached | grep -Eq 'github_pat_|ghp_|gho_|x-access-token|AUTHORIZATION'; then echo "refusing to commit: credential-like text found"; exit 1; fi
          git commit -q -m "live site test results" && git pull -q --rebase && git push -q || true
