# Daily production: new pairs straight into Cloudflare R2. Several jobs run side by side.
name: produce
on:
  # Daily schedule is OFF until the 30-pair test is approved. To enable, add:
  #   schedule: [{cron: "17 1 * * *"}]
  workflow_dispatch:
    inputs:
      per_job: {description: "pairs per job", default: "150"}
permissions:
  contents: write
concurrency: {group: produce, cancel-in-progress: false}
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      max-parallel: 1        # raise after the first weeks; one job keeps the registry simple
      matrix: {shard: [1]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with: {path: models, key: models-v2}
      - run: bash scripts/get_models.sh
      - name: produce
        env:
          R2_ACCOUNT_ID: "${{ secrets.R2_ACCOUNT_ID }}"
          R2_BUCKET: "${{ secrets.R2_BUCKET }}"
          R2_KEY_ID: "${{ secrets.R2_KEY_ID }}"
          R2_SECRET: "${{ secrets.R2_SECRET }}"
        run: python run.py --source commons --target ${{ inputs.per_job || 150 }} --time-limit 320 --store r2 --out out/run --registry state/registry.json
      - name: hide pairs players reported
        env: {FIREBASE_DB: "${{ secrets.FIREBASE_DB }}", R2_ACCOUNT_ID: "${{ secrets.R2_ACCOUNT_ID }}", R2_BUCKET: "${{ secrets.R2_BUCKET }}", R2_KEY_ID: "${{ secrets.R2_KEY_ID }}", R2_SECRET: "${{ secrets.R2_SECRET }}"}
        run: python scripts/hide_reported.py
      - name: save registry
        run: |
          mkdir -p logs && cp out/run/run.json logs/run-$(date +%Y%m%d)-${{ github.run_number }}.json
          git config user.name "lamma-factory"; git config user.email "factory@users.noreply.github.com"
          git add state logs
          if git diff --cached | grep -Eq 'github_pat_|ghp_|gho_|x-access-token|AUTHORIZATION'; then echo "refusing to commit: credential-like text found"; exit 1; fi
          git commit -m "production $(date +%F)" && git push || true
