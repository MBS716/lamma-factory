# Manual run: spot-the-difference pairs from public-domain paintings (Wikimedia Commons), saved for offline review.
name: art-run
on:
  push:
    branches: [main]
    paths: [".github/art-request"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - name: models (cached)
        uses: actions/cache@v4
        with: {path: models, key: models-v2}
      - run: bash scripts/get_models.sh
      - name: produce
        run: python run.py --source commons-art --target 40 --max-attempts 500 --time-limit 300 --mix 0.45,0.4,0.15 --per-author 5 --save-pairs --store local --out reports/art-${{ github.run_number }} --registry state/art_registry.json --report
      - name: keep results in the repo
        run: |
          rm -rf reports/art-${{ github.run_number }}/bucket/pairs
          git config user.name "lamma-factory"; git config user.email "factory@users.noreply.github.com"
          git add reports state
          if git diff --cached | grep -Eq 'github_pat_|ghp_|gho_|x-access-token|AUTHORIZATION'; then echo "refusing to commit: credential-like text found"; exit 1; fi
          git commit -m "art run ${{ github.run_number }}" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 10; done
