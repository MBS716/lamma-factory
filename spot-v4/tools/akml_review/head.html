<title>مراجعة أسئلة أكملها</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>[hidden]{display:none!important}header p{margin:0}
/* Layout: a sticky filter bar over one column of question cards; each card is one decision. */
:root{
  --bg:#f5f3ec; --panel:#fffdf7; --ink:#1b1f3a; --muted:#5d6286; --line:#dcd7c6;
  --navy:#1c2450; --gold:#b9800f; --gold-soft:#f6e7c4;
  --ok:#11795a; --ok-soft:#d8f0e6; --no:#b33a2b; --no-soft:#f6ddd8; --hold:#8a5a00; --hold-soft:#f5ead0;
  --display:"Noto Naskh Arabic", "Amiri", serif; --ui:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1430; --panel:#161d42; --ink:#f3eedf; --muted:#a9b0d4; --line:#2f3a72;
  --navy:#252f63; --gold:#f6b93b; --gold-soft:#3a3420;
  --ok:#35c896; --ok-soft:#123a30; --no:#ff8a78; --no-soft:#3d1f22; --hold:#f2c35b; --hold-soft:#38301a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1430; --panel:#161d42; --ink:#f3eedf; --muted:#a9b0d4; --line:#2f3a72;
  --navy:#252f63; --gold:#f6b93b; --gold-soft:#3a3420;
  --ok:#35c896; --ok-soft:#123a30; --no:#ff8a78; --no-soft:#3d1f22; --hold:#f2c35b; --hold-soft:#38301a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.65;direction:rtl;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 60px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-size:1.9rem;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:0;max-width:68ch}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;display:flex;flex-direction:column;min-width:110px}
.stat b{font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem}
.prog{display:flex;flex-direction:column;gap:4px}.pbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.pbar i{display:block;height:100%;background:var(--gold);width:0}#ptext{font-size:.88rem;color:var(--muted)}
.tbl table{width:100%;border-collapse:collapse;font-size:.9rem}.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:start}.tbl th{color:var(--muted);font-weight:600}
.note.warn{border-color:var(--gold)}.chip.xg{background:color-mix(in srgb,var(--gold) 18%,transparent)}
.bulkwrap{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);padding-block:6px;display:flex;flex-direction:column;gap:6px}.bulk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}#selCount{font-weight:700;margin-inline-end:6px}
.bulk button,.decide button.more{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;cursor:pointer}.bulk button:disabled{opacity:.45;cursor:not-allowed}
.confirm{border:2px solid var(--gold);border-radius:12px;padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:6px}.confirm p{margin:0}
.recbox{border:1px dashed var(--gold);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:.93rem}.recbox p{margin:4px 0}.recbox.r-reject{border-color:var(--no)}.recbox.r-keep{border-color:var(--ok)}.fixp{color:var(--ink)}
.chip.sp{background:color-mix(in srgb,var(--gold) 22%,transparent)}.card.flagged{box-shadow:inset 3px 0 0 var(--gold)}
label.sel{display:inline-flex;gap:4px;align-items:center;font-size:.85rem;color:var(--muted);cursor:pointer}label.sel input{width:18px;height:18px}
.card.compact{padding:10px 12px;gap:4px}.card.compact .phrase{font-size:1.05rem;margin:2px 0}.cmeta{margin:0;font-size:.9rem;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.cmeta .opts{display:inline-flex;gap:4px;flex-wrap:wrap}
.d-okfix[aria-pressed=true]{background:var(--ok);color:#fff}
#moreBtn{align-self:center;margin:12px auto;display:block;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 22px}#moreBtn[hidden]{display:none!important}header p{margin:0}
.stat.ok b{color:var(--ok)} .stat.no b{color:var(--no)} .stat.hold b{color:var(--hold)} .stat.mine b{color:var(--gold)}
.note{background:var(--gold-soft);border-radius:12px;padding:10px 14px;font-size:.92rem}
.bar{padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row label{color:var(--muted);font-size:.85rem;margin-inline-end:4px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px}
button{font:inherit;cursor:pointer}
.seg button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 12px;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
input[type=search]{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:6px 12px;min-width:0;flex:1 1 220px}
.count{color:var(--muted);font-size:.85rem}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.st-rejected{opacity:.86}
.top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.82rem;color:var(--muted)}
.id{font-family:ui-monospace,monospace;direction:ltr}
.chip{border-radius:999px;padding:1px 10px;border:1px solid var(--line)}
.chip.accepted{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.rejected{background:var(--no-soft);color:var(--no);border-color:transparent}
.chip.reserve{background:var(--hold-soft);color:var(--hold);border-color:transparent}
.phrase{font-family:var(--display);font-size:1.45rem;line-height:1.8;margin:0;text-wrap:balance}
.phrase mark{background:none;color:var(--gold);border-bottom:2px solid var(--gold);padding-inline:2px}
.opts{display:flex;flex-wrap:wrap;gap:6px;font-size:.92rem}
.opts span{border:1px solid var(--line);border-radius:8px;padding:2px 10px}
.opts span.right{border-color:var(--ok);color:var(--ok);font-weight:600}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:.92rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv a{color:var(--gold)}
.rev{font-size:.88rem;border-inline-start:3px solid var(--line);padding-inline-start:10px;color:var(--muted)}
.rev.no{border-color:var(--no)} .rev.hold{border-color:var(--hold)} .rev.fix{border-color:var(--gold)}
.decide{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px dashed var(--line);padding-top:8px}
.decide .lbl{color:var(--muted);font-size:.85rem}
.decide button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:4px 12px;font-size:.88rem}
.decide button[aria-pressed="true"].d-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.decide button[aria-pressed="true"].d-no{background:var(--no);border-color:var(--no);color:#fff}
.decide button[aria-pressed="true"].d-edit{background:var(--hold);border-color:var(--hold);color:#fff}
.decide textarea{font:inherit;font-size:.9rem;flex:1 1 100%;min-height:2.4em;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg);color:var(--ink);resize:vertical}
.tpanel{background:var(--panel);border:2px solid var(--gold);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.tpanel h2{margin:0;font-family:var(--display);font-size:1.2rem} .tpanel .muted{margin:0;color:var(--muted);font-size:.9rem}
.trow{display:flex;flex-direction:column;gap:4px;border-top:1px dashed var(--line);padding-top:8px}
.ttop{display:flex;flex-wrap:wrap;gap:8px;align-items:center} .tphr{font-family:var(--display);font-size:1.1rem}
.trow .decide{border-top:0;padding-top:0} .tphr mark{background:none;color:var(--gold);border-bottom:2px solid var(--gold)}
.decide button.d-clear{color:var(--muted);border-style:dashed;font-size:.8rem} .trow textarea{min-height:2em}
.tlog{margin:0;font-size:.85rem;color:var(--ok)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tools button,.imp{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:5px 12px;cursor:pointer}
.imp input{display:none} #permBtn{border-color:var(--gold);color:var(--gold);font-weight:600}
.diag summary{cursor:pointer;color:var(--muted);font-size:.88rem} .diag .kv{margin-top:6px}
#expBox{display:flex;flex-direction:column;gap:6px} #expText{min-height:8em;font-family:ui-monospace,monospace;font-size:.8rem;direction:ltr;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.sync{margin:0;font-size:.9rem;color:var(--muted)}
.sync.ok{color:var(--ok)} .sync.warn{color:var(--hold);font-weight:600}
.dcs{display:inline-flex;gap:6px;flex-wrap:wrap}
.chip.dec{font-weight:600} .chip.dec.d-ok{background:var(--ok);color:#fff;border-color:transparent} .chip.dec.d-edit{background:var(--hold);color:#fff;border-color:transparent} .chip.dec.d-no{background:var(--no);color:#fff;border-color:transparent}
.chip.pend{border-color:var(--hold);color:var(--hold)} .chip.saved-chip{border-color:var(--ok);color:var(--ok)}
.skips{display:flex;flex-direction:column;gap:6px}
.skips div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.9rem}
.skips b{font-family:var(--display);font-size:1.05rem}
.empty{color:var(--muted);padding:20px;text-align:center}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (max-width:520px){.phrase{font-size:1.25rem}.kv{grid-template-columns:1fr}.kv dt{margin-top:4px}}
</style>
